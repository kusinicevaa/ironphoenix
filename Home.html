<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iron Phoenix</title>

  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: url('images/IronPhoenixBanner.png') no-repeat center center/cover;
      background-attachment: fixed;
      color: #fff;
      overflow-x: hidden;
    }

    /* LOGO TOP LEFT */
    header {
      position: fixed;
      top: 20px;
      left: 40px;
      z-index: 1000;
    }

    header img {
      width: 160px;
      height: auto;
    }

    /* HERO SECTION */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background: none; /* IMPORTANT FIX */
    }

    /* VIDEO BOX */
    .video-container {
      width: 80%;
      max-width: 900px;
      border: 4px solid #ff6600;
      box-shadow: 0 0 20px #ff6600;
      margin-bottom: 20px;
      background: #000;
    }

    .video-container iframe {
      width: 100%;
      height: 500px;
      border: none;
    }

    /* TAGLINE — FIXED METALLIC GRADIENT */
    .tagline {
      font-size: 2.4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;

      background: linear-gradient(90deg, #ff6600 0%, #ff3300 40%, #d6d6d6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow:
        0 0 10px rgba(255, 102, 0, 0.8),
        0 0 20px rgba(255, 51, 0, 0.6),
        0 0 40px rgba(255, 51, 0, 0.4);

      margin-bottom: 40px;
    }

    /* CTA BUTTONS */
    .cta-buttons {
      display: flex;
      gap: 20px;
    }

    .cta-buttons a {
      text-decoration: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 5px;
      transition: 0.3s;
    }

    .book {
      background: linear-gradient(90deg, #ff6600, #ff3300);
      color: #fff;
      box-shadow: 0 0 15px #ff6600;
    }

    .book:hover {
      transform: scale(1.05);
    }

    .enquire {
      background: #333;
      color: #fff;
      border: 2px solid #ff6600;
    }

    .enquire:hover {
      background: #ff6600;
      color: #000;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <header>
    <img src="images/IronPhoenixLogo.png" alt="Iron Phoenix Logo" />
  </header>

  <!-- HERO SECTION -->
  <section class="hero">

    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID"
              title="Iron Phoenix Teaser"
              allowfullscreen></iframe>
    </div>

    <div class="tagline">Too Hot to Hold. Too Strong to Break.</div>

    <div class="cta-buttons">
      <a href="#booking" class="book">Book Experience</a>
      <a href="#contact" class="enquire">Enquire Now</a>
    </div>

  </section>

</body>
</html>
